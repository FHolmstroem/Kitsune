name: Tests
on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyQt6 pytest
      - run: QT_QPA_PLATFORM=offscreen PYTHONPATH=src pytest tests/ -v