[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitsune"
version = "0.1.0"
description = "A white fox desktop pet that roams your screen"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "PyGetWindow>=0.0.9",
]

[project.scripts]
kitsune = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["mutants", ".*", "venv", "wsl_venv"]
